name: Deploy Kraken Control Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kraken-control/**'
      - '.github/workflows/kraken-control-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kraken-control/package.json
      - name: Install dependencies
        working-directory: kraken-control
        run: npm install --no-audit --no-fund
      - name: Validate Expo config
        working-directory: kraken-control
        run: npx expo-doctor
      - name: Export web app
        working-directory: kraken-control
        run: npx expo export --platform web --output-dir dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: kraken-control/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
