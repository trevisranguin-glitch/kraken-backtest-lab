name: Kraken Control Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraken-control-watchdog
  cancel-in-progress: false

jobs:
  staging-health:
    name: Verify staging health (paper-only)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe health endpoint with bounded retries
        id: probe
        shell: bash
        run: |
          set -u
          endpoint="https://kraken-control-staging.trevisranguin.workers.dev/health"
          ok=0
          response=""
          for attempt in 1 2 3; do
            echo "Health probe attempt ${attempt}/3"
            if response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$endpoint" 2>&1)"; then
              printf '%s\n' "$response"
              if printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s);if(d.ok===true&&d.mode==="PAPER_ONLY")process.exit(0)}catch{}process.exit(1)})'; then
                ok=1
                break
              fi
              echo "Health payload invalid or mode is not PAPER_ONLY."
            else
              echo "$response"
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          mkdir -p watchdog-report
          printf '%s' "$response" > watchdog-report/health-response.json
          if [ "$ok" -eq 1 ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "Health check passed: endpoint reachable and mode is PAPER_ONLY."
          else
            echo "result=degraded" >> "$GITHUB_OUTPUT"
            echo "::error::Kraken staging health check failed after 3 attempts. No repair or trading action was attempted."
            exit 1
          fi
      - name: Record durable run report
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_RESULT: ${{ steps.probe.outputs.result }}
        run: |
          mkdir -p watchdog-report
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > watchdog-report/report.json <<EOF
          {
            "timestamp": "$timestamp",
            "workflow": "Kraken Control Watchdog",
            "endpoint": "staging /health",
            "result": "${PROBE_RESULT:-unknown}",
            "stepOutcome": "$PROBE_OUTCOME",
            "expectedMode": "PAPER_ONLY",
            "automatedRepair": false,
            "liveTradingTouched": false
          }
          EOF
          {
            echo "## Kraken Control Watchdog"
            echo "- Timestamp (UTC): $timestamp"
            echo "- Endpoint: staging /health"
            echo "- Expected mode: `PAPER_ONLY`"
            echo "- Probe result: ${PROBE_RESULT:-unknown}"
            echo "- Automated repair: disabled"
            echo "- Live trading: not touched"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-watchdog-report-${{ github.run_id }}
          path: watchdog-report/
          retention-days: 90
          if-no-files-found: warn
