name: Adaptive strategy research tests
on:
  pull_request:
    paths:
      - 'adaptive/**'
      - 'tests/adaptive-strategy-engine.test.mjs'
      - 'tests/regime-engine.test.mjs'
      - 'tests/regime-competition.test.mjs'
      - 'tests/mean-reversion-study.test.mjs'
      - 'tests/accounting-engine.test.mjs'
      - 'tests/exit-policy-study.test.mjs'
      - '.github/workflows/adaptive-strategy-tests.yml'
  push:
    branches:
      - 'research/adaptive-strategy-competition'
      - 'research/regime-strategy-allocator'
      - 'research/mean-reversion-entry-study'
    paths:
      - 'adaptive/**'
      - 'tests/adaptive-strategy-engine.test.mjs'
      - 'tests/regime-engine.test.mjs'
      - 'tests/regime-competition.test.mjs'
      - 'tests/mean-reversion-study.test.mjs'
      - 'tests/accounting-engine.test.mjs'
      - '.github/workflows/adaptive-strategy-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/adaptive-strategy-engine.test.mjs tests/regime-engine.test.mjs tests/regime-competition.test.mjs tests/mean-reversion-study.test.mjs tests/accounting-engine.test.mjs tests/exit-policy-study.test.mjs
  market-research:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public Kraken OHLC and run walk-forward competition
        run: node adaptive/run-research.mjs
      - name: Run regime allocator competition
        run: node adaptive/run-regime-research.mjs
      - name: Run mean-reversion walk-forward competition
        run: node adaptive/run-mean-reversion-research.mjs
      - name: Save quantitative report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-walk-forward-report
          path: |
            adaptive-research-report.json
            regime-research-report.json
            mean-reversion-research-report.json
          if-no-files-found: ignore
          retention-days: 14
