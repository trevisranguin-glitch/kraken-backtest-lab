name: Kraken Control CI
on:
  pull_request:
    paths:
      - "kraken-control/**"
      - ".github/workflows/kraken-control-ci.yml"
  push:
    branches: ["feature/kraken-control-mvp"]
    paths:
      - "kraken-control/**"
      - ".github/workflows/kraken-control-ci.yml"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken-control/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kraken-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit