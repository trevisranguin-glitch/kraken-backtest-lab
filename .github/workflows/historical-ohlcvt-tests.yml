name: Historical OHLCVT importer tests
on:
  pull_request:
    paths:
      - 'historical_ohlcvt.py'
      - 'tests/test_historical_ohlcvt.py'
      - '.github/workflows/historical-ohlcvt-tests.yml'
  push:
    branches:
      - 'research/entry-signal-competition-v1'
    paths:
      - 'historical_ohlcvt.py'
      - 'tests/test_historical_ohlcvt.py'
      - '.github/workflows/historical-ohlcvt-tests.yml'
permissions:
  contents: read
jobs:
  importer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile historical_ohlcvt.py
      - run: python -m unittest discover -s tests -p 'test_historical_ohlcvt.py' -v
