name: Retrieve Kraken 4h research history

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kraken-history.yml"

permissions:
  contents: read

concurrency:
  group: kraken-history-retrieval
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download, verify, extract only three EUR pairs at 240 minutes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/parts output
          python - <<'PY'
          import hashlib, re, shutil, urllib.request, zipfile, json, csv, datetime
          from pathlib import Path

          base = "https://assets.kraken.com/marketing/institutions/"
          names = [f"Kraken_OHLCVT_Full.zip.part{i:02d}" for i in range(5)]
          work = Path("work")
          assembled = work / "Kraken_OHLCVT_Full.zip"
          chunk = 8 * 1024 * 1024

          manifest_req = urllib.request.Request(base + "OHLCVT_Full_PARTS_SHA256SUMS.txt", headers={"User-Agent": "kraken-v15-research/1.0"})
          checks = urllib.request.urlopen(manifest_req, timeout=120).read().decode("utf-8", "replace")
          expected = {}
          for line in checks.splitlines():
              h = re.search(r"\b([a-fA-F0-9]{64})\b", line)
              if h:
                  for name in names:
                      if name in line:
                          expected[name] = h.group(1).lower()
          missing = [n for n in names if n not in expected]
          if missing:
              raise SystemExit("Missing published SHA-256 entries: " + ", ".join(missing))

          sha_zip = hashlib.sha256()
          with assembled.open("wb") as dest:
              for name in names:
                  part = work / "parts" / name
                  req = urllib.request.Request(base + name, headers={"User-Agent": "kraken-v15-research/1.0"})
                  h = hashlib.sha256()
                  print("Downloading", name, flush=True)
                  with urllib.request.urlopen(req, timeout=120) as response, part.open("wb") as out:
                      while True:
                          b = response.read(chunk)
                          if not b: break
                          out.write(b); h.update(b)
                  if h.hexdigest() != expected[name]:
                      raise SystemExit(f"SHA-256 mismatch for {name}: {h.hexdigest()}")
                  print("Verified", name, h.hexdigest(), flush=True)
                  with part.open("rb") as src:
                      while True:
                          b = src.read(chunk)
                          if not b: break
                          dest.write(b); sha_zip.update(b)
                  part.unlink()
          print("All five archive parts passed Kraken's published SHA-256 checks.", flush=True)
          print("Reassembled ZIP SHA-256:", sha_zip.hexdigest(), flush=True)

          targets = {
              "XBTEUR": ("XBTEUR", "XXBTZEUR", "XBTZEUR"),
              "ETHEUR": ("ETHEUR", "XETHZEUR", "ETHZEUR"),
              "SOLEUR": ("SOLEUR", "XSOLZEUR", "SOLZEUR"),
          }
          found = {}
          with zipfile.ZipFile(assembled) as z:
              csvs = [n for n in z.namelist() if n.lower().endswith(".csv")]
              for pair, aliases in targets.items():
                  candidates = []
                  for member in csvs:
                      stem = Path(member).stem.upper()
                      if stem.endswith("_240") and stem[:-4] in aliases:
                          candidates.append(member)
                  preferred = [m for m in candidates if Path(m).stem.upper() == pair + "_240"]
                  if preferred:
                      candidates = preferred
                  if len(candidates) != 1:
                      raise SystemExit(f"{pair}: expected exactly one exact-name 240m CSV, got {candidates[:20]}")
                  member = candidates[0]
                  out = Path("output") / f"{pair}_240.csv"
                  rows = 0
                  first_ts = last_ts = None
                  previous_ts = None
                  with z.open(member) as src, out.open("wb") as dst:
                      shutil.copyfileobj(src, dst, length=chunk)
                  with out.open("r", newline="") as f:
                      for row in csv.reader(f):
                          if len(row) not in (6, 7):
                              raise SystemExit(f"{pair}: malformed row {rows+1}: {row[:8]}")
                          ts = int(row[0])
                          vals = [float(x) for x in row[1:6]]
                          o, h, l, c, volume = vals
                          if ts < 0 or min(o, h, l, c) <= 0 or volume < 0:
                              raise SystemExit(f"{pair}: invalid values at row {rows+1}")
                          if h < max(o, c, l) or l > min(o, c, h):
                              raise SystemExit(f"{pair}: inconsistent OHLC at row {rows+1}")
                          if previous_ts is not None and ts <= previous_ts:
                              raise SystemExit(f"{pair}: timestamps not strictly increasing at row {rows+1}")
                          previous_ts = ts
                          if first_ts is None: first_ts = ts
                          last_ts = ts
                          rows += 1
                  if rows < 100:
                      raise SystemExit(f"{pair}: unexpectedly few rows: {rows}")
                  found[pair] = {
                      "archive_member": member, "file": str(out), "rows": rows,
                      "first_timestamp": first_ts, "last_timestamp": last_ts,
                      "first_utc": datetime.datetime.fromtimestamp(first_ts, datetime.timezone.utc).isoformat(),
                      "last_utc": datetime.datetime.fromtimestamp(last_ts, datetime.timezone.utc).isoformat(),
                      "sha256": hashlib.sha256(out.read_bytes()).hexdigest()
                  }
                  print(pair, found[pair], flush=True)

          Path("output/manifest.json").write_text(json.dumps({
              "source": "Kraken official historical OHLCVT archive",
              "interval_minutes": 240,
              "archive_sha256": sha_zip.hexdigest(),
              "pairs": found,
              "note": "Kraken archive omits no-trade intervals; gaps are preserved and must be normalized explicitly by V15 importer."
          }, indent=2))
          assembled.unlink()
          shutil.rmtree(work / "parts", ignore_errors=True)
          PY

      - name: Upload verified CSVs as a short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: kraken-v15-historical-4h
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
