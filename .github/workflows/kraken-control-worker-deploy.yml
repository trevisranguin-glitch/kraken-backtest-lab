name: Deploy Kraken Control Worker (staging)

on:
  push:
    branches: [main]
    paths:
      - "kraken-control/worker/**"
      - ".github/workflows/kraken-control-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraken-control-worker-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging Worker only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify paper-only deployment config
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'APP_MODE = "PAPER_ONLY"' kraken-control/worker/wrangler.toml
          grep -Fqx 'crons = ["*/15 * * * *"]' kraken-control/worker/wrangler.toml
          echo "Config declares paper-only mode and 15-minute cron."
      - name: Verify deployment credential is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN. Add it as a GitHub Actions secret (repository or staging environment), then rerun this workflow."
            exit 1
          fi
          echo "Cloudflare credential is present; value is not displayed."
      - name: Deploy staging Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "kraken-control/worker"
          command: deploy
      - name: Verify deployed health and paper mode
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://kraken-control-staging.trevisranguin.workers.dev/health)"
          printf '%s\n' "$response"
          printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s);if(d.ok===true&&d.mode==="PAPER_ONLY")process.exit(0)}catch{}process.exit(1)})'
          echo "Deployed staging endpoint is healthy and paper-only."
